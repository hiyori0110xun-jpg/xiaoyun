name: xiaoyun

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  wakeup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install anthropic pytz
      - run: python main.py
        env:
          ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_KEY }}
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
      - name: 保存发送记录
        run: |
          git config user.name "xiaoyun"
          git config user.email "xiaoyun@bot"
          git add sent_record.json message_history.json
          git diff --staged --quiet || git commit -m "update records"
          git push
